<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="hexClip">
      <polygon points="289.9,85 289.9,235 160,310 30.1,235 30.1,85 160,10"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="320" height="320" fill="#0d1117"/>

  <!-- photo clipped to hexagon -->
  <g clip-path="url(#hexClip)">
    <image href="https://raw.githubusercontent.com/thiyagarasan6380-alt/thiyagarasan6380-alt/main/assets/DSC_4319.jpeg"
           x="0" y="0" width="320" height="320" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- pulsing glow border -->
  <polygon points="289.9,85 289.9,235 160,310 30.1,235 30.1,85 160,10"
           fill="none" stroke="#00fff2" stroke-width="4" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </polygon>

  <!-- crisp inner outline -->
  <polygon points="289.9,85 289.9,235 160,310 30.1,235 30.1,85 160,10"
           fill="none" stroke="#00fff2" stroke-width="1.5" opacity="0.9"/>
</svg>
